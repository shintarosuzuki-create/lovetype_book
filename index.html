<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラブタイプ恋愛免許証 | 書籍購入者限定 特典お渡し所</title>
<meta name="description" content="「ラブタイプ診断 恋の教科書」購入者限定特典。名前とラブタイプを入れるだけで、あなただけの「ラブタイプ恋愛免許証」が発行できます。">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta property="og:type" content="website">
<meta property="og:title" content="ラブタイプ恋愛免許証 | 書籍購入者限定 特典お渡し所">
<meta property="og:description" content="名前とラブタイプを入れるだけ。あなただけの恋愛免許証を発行してSNSでシェアしよう。">
<meta property="og:image" content="assets/img/sample-license.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="hero__badge">ラブタイプ書籍購入者限定！特典お渡し所</span>
    <p class="hero__message">
      <span>「ラブタイプ診断　恋の教科書」のご予約、ありがとうございます！</span>
      <span>特別に、秘密の特典をプレゼントしちゃいます</span>
    </p>
  </header>

  <section class="panel gate" id="gate" hidden>
    <h2 class="panel__title">合言葉を入力してください</h2>
    <p class="gate__lead">
      書籍に記載されている合言葉を入力すると、特典の免許証を発行できます。
    </p>
    <form id="gate-form" novalidate>
      <div class="field">
        <label for="passcode">合言葉</label>
        <input type="text" id="passcode" name="passcode" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="書籍に記載の合言葉">
      </div>
      <p class="gate__error" id="gate-error" role="alert"></p>
      <button type="submit" class="btn btn--primary">ロックを解除する 🔓</button>
    </form>
  </section>

  <div id="gated-content" hidden>

  <section class="panel">
    <h2 class="panel__title">免許証を発行する</h2>

    <form id="license-form" novalidate>
      <div class="field">
        <label for="name">氏名<span class="field__hint">免許証に印字されます（最大12文字）</span></label>
        <input type="text" id="name" name="name" maxlength="12" placeholder="ラブ 太郎" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="type">あなたのラブタイプ</label>
        <select id="type" name="type" required>
          <option value="" disabled selected>16タイプから選んでください</option>
        </select>
        <p class="type-note" id="type-note"></p>
      </div>

      <button type="submit" class="btn btn--primary" id="submit">
        免許証を発行する 💌
      </button>
    </form>
  </section>

  </div><!-- /#gated-content -->

  <p class="footer">© ラブキャラ庁 ／ ラブタイプ診断 恋の教科書</p>
</div>

<script src="assets/js/gate.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/form.js"></script>
</body>
</html>
