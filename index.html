<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラブタイプ恋愛免許証</title>
<meta name="description" content="「ラブタイプ診断 恋の教科書」の特典。お名前とラブタイプを入れるだけで、あなただけの「ラブタイプ恋愛免許証」が発行できます。">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta property="og:type" content="website">
<meta property="og:title" content="ラブタイプ恋愛免許証">
<meta property="og:description" content="名前とラブタイプを入れるだけ。あなただけの恋愛免許証を発行してSNSでシェアしよう。">
<meta property="og:image" content="assets/img/sample-license.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <picture>
      <source srcset="assets/img/hero.webp" type="image/webp">
      <img src="assets/img/hero.png" width="924" height="1055"
           alt="9/1から予約受付スタート。累計1億回再生された「ラブタイプ診断」ついに書籍化。ラブタイプ診断 恋の教科書 ー 傾向と対策♡16タイプ別 ー 発売元 集英社">
    </picture>
  </header>

  <div class="below">

  <section class="card card--ribbon" id="gate" hidden>
    <h1 class="card__title">合言葉を入力してください</h1>
    <p class="card__lead">公式LINEで受け取った合言葉を入力すると、プレゼントがもらえます</p>
    <form id="gate-form" novalidate>
      <div class="field">
        <label for="passcode">合言葉</label>
        <input type="text" id="passcode" name="passcode" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="公式LINEで受け取った合言葉">
      </div>
      <p class="gate__error" id="gate-error" role="alert"></p>
      <button type="submit" class="btn">ロックを解除する 🔓</button>
    </form>
  </section>

  <div id="gated-content" hidden>
    <section class="card card--ribbon">
      <h1 class="card__title">ご予約ありがとうございます！</h1>
      <p class="card__lead">限定特典をプレゼントします♡</p>

      <form id="license-form" novalidate>
        <div class="field">
          <label for="name">お名前<span class="field__hint">（最大12文字）</span></label>
          <input type="text" id="name" name="name" maxlength="12" placeholder="ラブ教授" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="type">あなたのラブタイプ</label>
          <select id="type" name="type" required>
            <option value="" disabled selected>選んでください</option>
          </select>
          <p class="field__note">※16タイプから選んでください</p>
        </div>

        <button type="submit" class="btn" id="submit">特典を受け取る <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg></button>
      </form>
    </section>
  </div>

  <p class="footer">©2026 Love Type / 株式会社ラブキャラ</p>

  </div><!-- /.below -->
</div>

<script src="assets/js/gate.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/form.js"></script>
</body>
</html>
