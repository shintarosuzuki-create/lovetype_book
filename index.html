<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラブタイプ恋愛免許証</title>
<meta name="description" content="「ラブタイプ診断 恋の教科書」の特典。お名前とラブタイプを入れるだけで、あなただけの「ラブタイプ恋愛免許証」が発行できます。">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta property="og:type" content="website">
<meta property="og:title" content="ラブタイプ恋愛免許証">
<meta property="og:description" content="名前とラブタイプを入れるだけ。あなただけの恋愛免許証を発行してSNSでシェアしよう。">
<meta property="og:image" content="assets/img/sample-license.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <p class="hero__message">
      <span>「ラブタイプ診断　恋の教科書」のご予約、ありがとうございます！</span>
      <span>限定の特典をプレゼントします♡</span>
    </p>
  </header>

  <section class="panel gate" id="gate" hidden>
    <h2 class="panel__title">合言葉を入力してください</h2>
    <p class="gate__lead">
      公式LINEで受け取った合言葉を入力すると、プレゼントがもらえます
    </p>
    <form id="gate-form" novalidate>
      <div class="field">
        <label for="passcode">合言葉</label>
        <input type="text" id="passcode" name="passcode" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="公式LINEで受け取った合言葉">
      </div>
      <p class="gate__error" id="gate-error" role="alert"></p>
      <button type="submit" class="btn btn--primary">ロックを解除する 🔓</button>
    </form>
  </section>

  <div id="gated-content" hidden>

  <section class="panel">
    <form id="license-form" novalidate>
      <div class="field">
        <label for="name">あなたのお名前<span class="field__hint">（最大12文字）</span></label>
        <input type="text" id="name" name="name" maxlength="12" placeholder="ラブ 太郎" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="type">あなたのラブタイプ</label>
        <select id="type" name="type" required>
          <option value="" disabled selected>16タイプから選んでください</option>
        </select>
      </div>

      <button type="submit" class="btn btn--primary" id="submit">
        特典を受け取る 💌
      </button>
    </form>
  </section>

  </div><!-- /#gated-content -->

  <p class="footer">© 2026 Love Type / 株式会社ラブキャラ</p>
</div>

<script src="assets/js/gate.js"></script>
<script src="assets/js/types.js"></script>
<script src="assets/js/form.js"></script>
</body>
</html>
